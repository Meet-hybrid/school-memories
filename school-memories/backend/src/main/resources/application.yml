spring:
  application:
    name: keepsake-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/keepsake}
    username: ${DB_USER:keepsake}
    password: ${DB_PASSWORD:keepsake}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

keepsake:
  school:
    name: ${SCHOOL_NAME:Character Training Secondary School}
    invite-code: ${SCHOOL_INVITE_CODE:}
  # Public origin of the frontend — used to build absolute links inside emails.
  app:
    base-url: ${APP_BASE_URL:http://localhost:3000}
  jwt:
    # Override in production with a long random value via the JWT_SECRET env var.
    secret: ${JWT_SECRET:dev-only-secret-please-override-in-production-0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000} # 7 days
  upload-dir: ${UPLOAD_DIR:./data/uploads}
  # Where uploaded media lives. local = disk under upload-dir (served at /uploads/*);
  # s3 = any S3-compatible object store (see keepsake.storage.s3.*).
  storage:
    type: ${STORAGE_TYPE:local}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      bucket: ${S3_BUCKET:}
      # Optional CDN/proxy origin for public URLs; defaults to endpoint + bucket.
      public-base-url: ${S3_PUBLIC_BASE_URL:}
  # Optional ffmpeg binary used to extract poster frames from uploaded videos.
  # Leave empty to skip poster generation.
  media:
    ffmpeg-path: ${FFMPEG_PATH:}
  # Google sign-in. Leave GOOGLE_CLIENT_ID unset to hide the button.
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  # When true, verification / password-reset links are emailed via spring.mail.*
  # (SMTP_HOST/SMTP_PORT/SMTP_USERNAME/SMTP_PASSWORD). When false, they are
  # returned by the API and logged to the console instead.
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}

logging:
  level:
    org.springframework.security: WARN
    com.keepsake: INFO
